name: release

# Publishing from a workstation is blocked whenever `npm login` has not been run
# there, so the tag is the release trigger: push a version tag and CI publishes.
# 认证优先走 OIDC（npm Trusted Publishing）：GitHub 每次发布签一张短时凭据。
# NPM_TOKEN 只在 OIDC 不可用时兜底，npm CLI 的优先级是 OIDC → token。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只做 npm publish --dry-run'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 单元测试
        run: node --test test/*.test.mjs
      - name: 技能包体检
        run: node scripts/migrate-skillpack.mjs --check
      - name: 契约闸
        run: node bin/shipgate.mjs spec check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC：npm 用 GitHub 签发的短时凭据认证
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # setup-node 带的 npm 是 10.x，低于 trusted publishing 要求的 11.5.1
      - name: 升级 npm（OIDC 需要 ≥ 11.5.1）
        run: npm i -g npm@^11.15.0

      - name: 读取包版本
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: tag 与 package.json 版本一致性
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.pkg.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag 与 package.json $version 不一致，拒绝发布"
            exit 1
          fi

      - name: npm publish --dry-run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run

      # OIDC 优先：npm CLI 先检测 GitHub 的 OIDC 环境并用它认证，失败才回退 token。
      # 所以这里只提示、不阻断；绑定生效后 NPM_TOKEN 可以整个删掉。
      - name: 检查发布凭据（OIDC 优先，token 兜底）
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "::notice::检测到 NPM_TOKEN，但 npm 会优先用 OIDC（Trusted Publishing），token 仅兜底"
          else
            echo "::notice::未配置 NPM_TOKEN，仅靠 OIDC 发布；若失败请确认包已绑定 Trusted Publisher 且勾选了 Allow npm publish"
          fi

      # 幂等：重跑 dispatch 或重推同一个 tag 时，版本已存在会让 npm publish 报 E403，
      # 那个红灯掩盖真问题。只有 npm view 成功取到版本才算已发布；查询失败一律按未发布继续。
      - name: 版本是否已发布（幂等）
        id: published
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: |
          pkg=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$pkg@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$pkg@$version 已存在于 npm，跳过发布"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && steps.published.outputs.already == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
