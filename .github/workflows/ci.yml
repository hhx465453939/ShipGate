name: ci

# 常规 CI：每次进 main 的改动都要过测试与仓库级闸，
# 不让坏代码等到打 tag 发版时才发现。发布仍只由 release.yml 的 tag 打开。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 单元测试
        run: node --test test/*.test.mjs
      - name: 技能包体检
        run: node scripts/migrate-skillpack.mjs --check
      - name: 契约闸
        run: node bin/shipgate.mjs spec check

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 固定版本：质量闸的规则随版本变化，浮动会让同一份代码今天绿明天红。
      - name: 安装 aislop（固定版本）
        run: npm i -g aislop@0.23.0
      - name: 质量闸
        run: node bin/shipgate.mjs quality .
